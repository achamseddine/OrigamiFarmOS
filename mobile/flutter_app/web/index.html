<!DOCTYPE html>
<html>
<head>
  <!--
    Replaced by `flutter build web --base-href`. The web build is made once
    with "/" and the deploy step rewrites this one line for where it is
    served: /app/ on the farm server, /<repo>/ on GitHub Pages
    (architecture/ADR-004-WEB-CLIENT.md).
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Origami FarmOS — the farm's animals, milk, feed, health, fields, Mouneh and visits, in the browser.">
  <meta name="theme-color" content="#2F6B4F">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="FarmOS">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Origami FarmOS</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* The tablet's splash: the Origami mark on stone paper, shown while
       the app loads; Flutter replaces the page once it has drawn. */
    html, body { margin: 0; height: 100%; background: #F7F5F0; }
    #farmos-splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #656A65;
    }
    #farmos-splash img { width: 112px; height: 112px; }
    #farmos-splash .bar { width: 160px; height: 3px; border-radius: 2px; background: #E3DFD7; overflow: hidden; }
    #farmos-splash .bar::after {
      content: ""; display: block; width: 40%; height: 100%; background: #2F6B4F;
      animation: farmos-load 1.2s ease-in-out infinite;
    }
    @keyframes farmos-load { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
    @media (prefers-color-scheme: dark) { html, body { background: #0D1713; } #farmos-splash { color: #9AA39C; } }
  </style>
</head>
<body>
  <div id="farmos-splash" aria-label="Loading Origami FarmOS">
    <img src="icons/Icon-192.png" alt="">
    <div class="bar"></div>
    <noscript>Origami FarmOS needs JavaScript turned on.</noscript>
  </div>
  <script>
    // Remove the splash as soon as Flutter has drawn its first frame.
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('farmos-splash');
      if (s) s.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
