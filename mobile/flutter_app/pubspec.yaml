name: farmos
description: "Origami FarmOS — offline-capable, tablet-first farm operating system."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  flutter_svg: ^2.0.10+1
  http: ^1.2.2
  shared_preferences: ^2.2.3

  # On-device cache + outbox, so a tablet taken out to a field keeps
  # working and the records it collects reach the server on the way back.
  sqflite: ^2.3.3
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/logo/
    # Reference copies of the original design-system data (not read by app
    # code today — the i18n table lives in core/i18n/strings.dart — kept
    # bundled for provenance).
    - assets/i18n/
    - assets/data/
