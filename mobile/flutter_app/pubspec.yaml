name: farmos
description: "Origami FarmOS — offline-first, tablet-first farm operating system."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  flutter_svg: ^2.0.10+1
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.3
  shared_preferences: ^2.2.3
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/logo/
    # Reference copies of the original design-system data (not read by app
    # code today — the i18n table lives in core/i18n/strings.dart and demo
    # data in data/demo/demo_data.dart — kept bundled for provenance).
    - assets/i18n/
    - assets/data/
