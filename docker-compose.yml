services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: origami
      POSTGRES_USER: origami
      POSTGRES_PASSWORD: origami
    ports: ["5432:5432"]
    volumes: [origami_postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U origami -d origami"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  origami_postgres:
