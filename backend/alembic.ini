[alembic]
# database/migrations/ lives at the repo root per tech spec §4/§5 repo
# layout, one level up from this backend/ directory.
script_location = %(here)s/../database/migrations
prepend_sys_path = .

# Overridden at runtime by database/migrations/env.py using
# app.core.config.get_settings().database_url (so the same migrations run
# against SQLite in dev and PostgreSQL in pilot/staging/production).
sqlalchemy.url = driver://user:pass@localhost/dbname

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
