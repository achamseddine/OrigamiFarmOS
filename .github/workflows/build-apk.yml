name: Build tablet APK

# Manual trigger only — this does not run on every push. The build
# environment used to develop this repo has an egress policy that blocks
# dl.google.com (the Android SDK distribution host), so the APK cannot be
# built there; GitHub-hosted runners have unrestricted network access and
# come with a pre-installed Android SDK, so the build runs here instead.
on:
  workflow_dispatch:
    inputs:
      build-mode:
        description: "Flutter build mode"
        required: false
        default: release
        type: choice
        options:
          - release
          - debug
  # workflow_dispatch only becomes available from the GitHub UI/API once
  # this file exists on the repo's default branch, so this push trigger
  # scoped to the MVP branch lets the first build run without needing that.
  push:
    branches:
      - claude/origami-farmos-tablet-mvp-u88i3e
      - feat/qr-animal-quick-entry
      - claude/gifted-davinci-mu9fjj
    paths:
      - ".github/workflows/build-apk.yml"
      - "mobile/flutter_app/**"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: mobile/flutter_app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Pin to the last verified APK toolchain: Flutter 3.50 requires Gradle
      # 9.3.1, while this app currently uses Gradle 8.14 / AGP 8.x.
      # Upgrade the Android toolchain together in a separate reviewed PR.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - run: flutter --version

      - run: flutter pub get

      - run: flutter analyze --no-fatal-infos --no-fatal-warnings

      # The offline cache/outbox logic is pure Dart and unit-tested; this
      # also catches a compile error anywhere in lib/ before the slower
      # APK build does.
      - run: flutter test

      # APP_VERSION reaches lib/app/build_info.dart and is printed under
      # the sign-in button, so which APK is on a given tablet is
      # answerable by looking at it rather than by remembering what was
      # sideloaded last. The server reports its own build the same way at
      # GET /health; between the two, "no change, same behaviour" can be
      # checked instead of guessed.
      #
      # The run number becomes the Android versionCode (and the visible
      # "0.1.N" build name). It only ever goes up, so Android treats each
      # build as an upgrade of the last one; with versionCode pinned at 1
      # every APK looked like the same app version and a tablet could
      # keep an old build while appearing to have been updated.
      # The build name carries the product release (product/RELEASES.md)
      # and the run number: 0.8.N is a build of release v0.8 (run N). The run
      # number alone stays the versionCode, so every build still installs
      # over the one before it.
      - run: |
          flutter build apk --${{ inputs.build-mode || 'release' }} \
            --build-number=${{ github.run_number }} \
            --build-name=0.8.${{ github.run_number }} \
            --dart-define=APP_BUILD="0.8.${{ github.run_number }}" \
            --dart-define=APP_VERSION="$(git rev-parse --short HEAD)"

      - uses: actions/upload-artifact@v4
        with:
          name: origami-farmos-${{ inputs.build-mode || 'release' }}-apk
          path: mobile/flutter_app/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

      # Actions artifacts are served from a rotating Azure Blob Storage
      # host that some network policies (including the one this repo was
      # developed under) block. A GitHub Release asset is served from
      # api.github.com / objects.githubusercontent.com instead, which is
      # reachable in more environments, so publish the APK there too.
      # The app's own update check (Settings → App updates,
      # lib/app/update/app_update_provider.dart) reads these releases: a tag
      # `tablet-v<version>-build-<run>`, the line "on branch `<branch>`" in
      # the body (only the main tablet branch's builds are offered to the
      # farm) and the attached .apk. Keep the three when editing this step.
      - name: Publish versioned APK prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tablet-v0.8.20-build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: "Origami FarmOS v0.8.20 — tablet APK 0.8.${{ github.run_number }}"
          body: |
            **Build 0.8.${{ github.run_number }}** — commit ${{ github.sha }} on branch `${{ github.ref_name }}`.
            Release notes: [product/RELEASES.md at this commit](https://github.com/${{ github.repository }}/blob/${{ github.sha }}/product/RELEASES.md).

            **Pre-release / on-farm test APK.** What is new since the last tablet build:
            - **v0.8.20:** **From the alert to the outcome** (Feed → Performance) — the manager records what was done about a feed performance alert; after the days chosen, the milk before and after is compared once from the records: as expected, no clear change or the opposite, with a confidence lowered for each confounder, or insufficient data; one notice until reviewed. Migration `d1f3a5c7e9b2`.
            - **v0.8.19:** **Least-cost drafts** (Feed → Nutrition) — up to three drafts of a formula at today's prices (the cheapest, one with a safety margin, the closest to today's), each meeting every requirement; infeasible or insufficient data said plainly; a manager approves one as a new draft version of the formula. Migration `c9e1a3b5d7f0`.
            - **v0.8.18:** **Feed nutrition** (Feed → Nutrition) — what the animals need, per species and stage, with its source and versions; a formula as the farm makes it (the base concentrate stays 1,210 kg before any premix, a premix on top as a what-if) assessed in its ration, each requirement met, below or above on dry matter — or **insufficient data**, naming what is unknown and recommending nothing. Migration `b7d9f1a3c5e8`.
            - **v0.8.14:** **Crop cycles** (Produce & Harvest → *Manage cycle*) — greenhouses, tunnels, fields and orchards; each crop cycle with its code, the work done (labour and the seeds, fertiliser and treatments taken from stock), the water and pumping cost, harvests into stock with losses, its produce sold, and its actual margin, unknown costs named, never counted as free. **The server needs migration `d9b1c3e5f7a2`.**
            - **v0.8.13:** **Cow profitability** (Reports) — each cow's morning and afternoon milk, saleable litres, their value at the farm's milk price, her feed (own and her share of the group's) and its cost per litre, vet and medicine, dairy labour and electricity, and her margin, week by week; anything the records cannot price is shown as unavailable, never as zero. No migration.
            - **v0.8.12:** **Buying feed** (Feed → Buying) — several suppliers' prices for each ingredient, cheapest first; purchase orders (a worker drafts, the manager places), deliveries received against them in parts with rejections and the quality seen, each becoming a lot with its supplier and price and a supplier's bill; *Ordered vs delivered* shows what was accepted, billed, paid and is still owed. A mix traces back to the order and the supplier. **The server needs migration `c7e9a1b3d5f8`.**
            - **v0.8.11:** **Milk entered offline is cleared by the farm server** — milk a tablet records without the server waits as *Waiting for check* (never stored, sold or handed over) until the server judges it from the treatment history; milk under a withdrawal recorded on another tablet is kept but **held** (never sold, the manager and vet told) instead of lost, and what the server refuses stays on the Milk page with Try again / Discard. The morning or afternoon milking is the **farm's hour**, whatever zone the device is in. No migration.
            - **v0.8.10:** **Offline sign-in after a restart** — a worker who signed in on this tablet in the last 7 days opens it again with no network (same email and password), sees their farm and records; nothing reaches the server until the next sign-in it accepts, then the queue is sent once. Only a salted check of the password is kept, never the password or the token. No migration.
            - **v0.8.9:** **Purchases in the books** — a delivery is stock for what was accepted (500 kg − 20 kg rejected at 0.50 = USD 240), one supplier bill (paid on delivery, on credit, or part paid), and cash only when paid (USD 100 paid → USD 140 still owed); bills paid in parts from Sales & Finance, returns credited, payments reversed, never counted twice. Migration `b5d7f9a1c3e6`; deliveries from before are reviewed once by the manager.
            - **v0.8.8:** **Mouneh sales in the farm's books** — every sale in the Mouneh shop is one sale in Sales & Finance (revenue once, on its day; the jars' production cost kept with it): paid now, owed by a named buyer, or part paid (the rest received later); a manager cancels one and its jars go back on the shelf, the revenue undone, what was paid refunded. Past Mouneh sales are put in the books once by a dry-run-then-apply reconciliation. Migration `a3c5e7f9b1d2`.
            - **v0.8.7:** **Feeding records you can trust** — what was eaten can no longer be more than what was given (grams converted first); a cow fed with her group and on her own in the same round, the same feed, is asked about — *Record as additional feeding* (saying why) or *Don't record* — in English or Arabic, offline too; supplements and partial group feedings are not asked. No migration.
            - **v0.8.6:** **One feeding plan the reports agree with** — each animal is planned **once**: a herd's line counts only the cows its ration feeds and names any cow on her own ration (*2 of 3 head*); a supplement adds on top; a **refusal is shown apart and never counted as fed**, in the plan, the costs, the reports and the reorder forecast; every *today*, *yesterday* and day-by-day figure is the **farm's day in Beirut** (a feeding at 00:30 is that day), summer time included. No migration.
            - **v0.8.5:** **Milk judged at the time it was milked** — milk entered later for a day inside a withdrawal is only accepted as withheld; milk the records cannot vouch for is **held for review** (Milk page) until a vet or the manager decides; a cow dried off yesterday can still have her earlier milk entered. Only saleable milk reaches the tank and the collector. **The server needs migration `e8a0c2e4b6d9`.**
            - **v0.8.4:** **Feed stock you can trust** — a feeding that names a lot holding too little is refused, never made up from another lot; recording past the stock needs the manager **and a reason**, and what was fed with no lot shows on the feed (*Fed with no lot*) until the manager **reconciles** it (the lot it came from, stock that was there, or a count). Two people feeding the last kilos at once can no longer both take them. **The server needs migration `d6f8a0c2e4b7`.**
            - **v0.8.3:** **Count stock** on inspection (the count becomes the stock, the difference kept as a count correction); only **concentrate, corn silage and hay & straw** are fed — raw materials go into mixes; each feed has a **price per kg** and every feeding shows its **cost**. **The server needs migration `c4e6a8b0d2f5`.**
            - **v0.8.2:** **Queue numbers** — the manager gives each cow her number in the milking line; the cow queue and **Record milk** follow it, the next cow opening by herself after each save (Skip, Stop), and a number typed in opens her cow. The **milk report** shows each cow's **morning and afternoon** and a **day-by-day sheet** of every cow; periods *Today* and *Yesterday*. **The server needs migration `b3d5f7a9c1e4`.**
            - **v0.8.1:** **After each milking** on the Milk page: litres to the calves, the rest to the collector at his agreed price (workers type litres only); **Collector paid** settles the whole week at once (USD or LBP, a deduction kept on record); the second milking is called **Afternoon** if the farm says so. **The server needs migration `a2c4e6f8b0d3`.**
            - **v0.8.0:** **Sales & Finance** — record any sale (eggs, vegetables, animals…) and any expense or bill, in USD or LBP at the rate the manager sets; mark paid, cancel with a reason; who owes what; profit and loss per month and activity. **Reports** gain *Sales* (everything sold) and *Stock* (everything in stock now). **Settings → App updates**: update to the newest APK from the app, and a notice when one is out. **The server needs migration `f7b9d1e3a5c8`.**
            - **v0.7.9:** **Sell milk** from the tank (Milk page and Sales & Finance: litres, price, buyer, paid or to be paid; mark paid, cancel with a reason; the tank worked out from the records, counted by the manager); **Reports** — milk, feed, herd and finance for a chosen period, printed or saved as PDF or exported as a spreadsheet (CSV). **The server needs migration `e6a8c0d2f4b7`.**
            - **v0.7.8:** employees enter the day's milk and feedings; buying feed, a feed mix and corrections go to the farm manager for approval (approvals card on My Day; *Ask to buy feed*; delivery against an approved request); the **cow queue** — follow the milking or feeding cow by cow, or scan in any order; *Record milk* with its date on the Milk page. **The server needs migration `d5f7b9c1e3a6`.**
            - **v0.7.7:** Feed, Mouneh, Farm Visits and Health open as one page — the band scrolls away, the tabs stay at the top and every tab (a mix, the day's feeding, a report) is read at full height instead of in a small window; the feed forms (purchase, mix, feeding, a mix's history) open full screen on the tablet with Save above the keyboard.
            - **v0.7.6:** *Milked on* — the milk record and quick entry take the day it was milked (today by default, up to 60 days back) for milk noted on paper and entered later; a milk record made offline keeps its date.
            - **v0.7.5:** the same app is now also built for the web, from the same code and at the same time as this APK (see the matching `web-v…` release).
            - **Login and Azure diagnostics (14 Nov 2026):** always-visible **Check API (no password sent)** tests `/health` and the OpenAPI route contract; login failures show HTTP status/route, DNS or timeout. After a successful login, farm-data startup errors are shown with Retry / Back to Login (preserves offline records) instead of an indefinite spinner. Auto-sync replay no longer holds up the first dashboard. The Azure staging service is publicly reachable and reports itself as `Origami Server API`, but **account and tenant access remain unverified**.
            - **Login recovery (14 Nov 2026):** always show email and password on every launch; no cached-session auto-login, saved server URL, or network call before the form. Simplified screen works in portrait and landscape. Default staging API is `https://leb-container-test-staging.azurewebsites.net/api/v1` (host identity/health are **not verified**). Existing local farm cache and pending offline writes are **not deleted**. Enter real credentials only after verifying the Azure host belongs to your farm's Origami deployment.
            - **Review (v0.7.4):** records can no longer be dated in the future or made on an animal that left the farm; milk needs the animal to be in milk (the tablet offers *Start milking* first); a raw grain is not fed directly and a mix cannot predate its ingredients; dropdowns, page headers and cards no longer overflow on portrait and small tablets; server refusals read as sentences. No migration.
            - **No duplicates, approval levels (v0.7.3):** the same milking, feeding, delivery, mix, insemination, dose, observation or sale entered twice is caught by the server and the tablet asks *Already recorded?* (record it again only if it really is a second one); stock overrides, new recipes, sales/culls and the farm calendar need the matching approval. No migration.
            - **Second round (v0.7.2):** *Record purchase* with supplier, date and quality, *Record a mix* in one step, a getting-started guide for the feed room; calving date with the milk-peak and insemination calendar (farm settings) and herd chips for who to inseminate, watch for heat or is at her peak; every reproduction form dated; groups for cows including pregnant / not-pregnant groups that follow the records; status on the farm (sold, died…) on the profile; work responsibilities with *My animals & duties*; faster server reads and lighter sign-in. **The server needs migrations `a8d0c2e4f6b1` and `c3e5a7b9d1f4`.**
            - **On-farm corrections (v0.7.1):** add an animal with nothing to scan — the app gives it a farm number and shows its QR label to print; *Is she pregnant?* (with the insemination date) and *Is she being milked?* on new and existing animals, saved as breeding / pregnancy-check / lactation / dry-off records, the milk record opening right after; **Settings → Dry-off before birth** (days) with the dry-off date on every pregnant animal in milk; the feeding form opens with **Concentrate, Corn silage, Wheat straw** rows (each optional) plus *Add another feed*, and asks before recording feed whose stock was never entered. **The server needs migration `a8d0c2e4f6b1`** (Actions → *Migrate & seed DB* → `migrate_only`).
            - **Scan-first worker rounds:** the tablet camera reads animal and pen QR labels offline; labels print from the tablet as an A4 PDF; pen labels open the group's feeding round; already-recorded-today and a second-milking check; feed rows from the animal's own program; morning/evening milking rounds from My Day.
            - **Layout from the V3 prototype:** Digital Twin with header, figures and tabs (milk, feed, weight, reproduction, health, timeline); animal registry with search; My Day routine; Feed & nutrition; Health command centre with health cases; Mouneh translated to Arabic.
            - **Livestock record:** state history, groups and memberships, breeding, pregnancy, births, lactation, incubation, exits.
            - **Safety:** milk under withdrawal is recorded as withheld; medicine only through the pharmacy with an approved route; farm isolation and module permissions enforced on the server.

            Not yet: photo attachments, body-condition scoring. Do not use as a production veterinary decision system.

            The sign-in screen of this build shows `App 0.8.${{ github.run_number }} · <commit>` under
            the button. If a tablet shows a different number after installing, the
            install did not take.

            Signed with the committed debug key (`android/signing/debug.keystore`), so
            builds from here on install over each other in place. **If the tablet has a
            build from before that key existed, uninstall the app once first** — Android
            refuses to replace an app signed with a different key and says "App not
            installed". Every build after that updates without uninstalling.

            Fine for sideloading onto a test tablet, not for Play Store distribution.
            This prerelease has its own versioned tag and does not overwrite any earlier release.
          prerelease: true
          files: mobile/flutter_app/build/app/outputs/flutter-apk/*.apk
