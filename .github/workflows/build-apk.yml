name: Build tablet APK

# Manual trigger only — this does not run on every push. The build
# environment used to develop this repo has an egress policy that blocks
# dl.google.com (the Android SDK distribution host), so the APK cannot be
# built there; GitHub-hosted runners have unrestricted network access and
# come with a pre-installed Android SDK, so the build runs here instead.
on:
  workflow_dispatch:
    inputs:
      build-mode:
        description: "Flutter build mode"
        required: false
        default: release
        type: choice
        options:
          - release
          - debug
  # workflow_dispatch only becomes available from the GitHub UI/API once
  # this file exists on the repo's default branch, so this push trigger
  # scoped to the MVP branch lets the first build run without needing that.
  push:
    branches:
      - claude/origami-farmos-tablet-mvp-u88i3e
      - feat/qr-animal-quick-entry
    paths:
      - ".github/workflows/build-apk.yml"
      - "mobile/flutter_app/**"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: mobile/flutter_app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Pin to the last verified APK toolchain: Flutter 3.50 requires Gradle
      # 9.3.1, while this app currently uses Gradle 8.14 / AGP 8.x.
      # Upgrade the Android toolchain together in a separate reviewed PR.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - run: flutter --version

      - run: flutter pub get

      - run: flutter analyze --no-fatal-infos --no-fatal-warnings

      # The offline cache/outbox logic is pure Dart and unit-tested; this
      # also catches a compile error anywhere in lib/ before the slower
      # APK build does.
      - run: flutter test

      # APP_VERSION reaches lib/app/build_info.dart and is printed under
      # the sign-in button, so which APK is on a given tablet is
      # answerable by looking at it rather than by remembering what was
      # sideloaded last. The server reports its own build the same way at
      # GET /health; between the two, "no change, same behaviour" can be
      # checked instead of guessed.
      #
      # The run number becomes the Android versionCode (and the visible
      # "0.1.N" build name). It only ever goes up, so Android treats each
      # build as an upgrade of the last one; with versionCode pinned at 1
      # every APK looked like the same app version and a tablet could
      # keep an old build while appearing to have been updated.
      - run: |
          flutter build apk --${{ inputs.build-mode || 'release' }} \
            --build-number=${{ github.run_number }} \
            --build-name=0.1.${{ github.run_number }} \
            --dart-define=APP_BUILD="0.1.${{ github.run_number }}" \
            --dart-define=APP_VERSION="$(git rev-parse --short HEAD)"

      - uses: actions/upload-artifact@v4
        with:
          name: origami-farmos-${{ inputs.build-mode || 'release' }}-apk
          path: mobile/flutter_app/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

      # Actions artifacts are served from a rotating Azure Blob Storage
      # host that some network policies (including the one this repo was
      # developed under) block. A GitHub Release asset is served from
      # api.github.com / objects.githubusercontent.com instead, which is
      # reachable in more environments, so publish the APK there too.
      - name: Publish versioned QR APK prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tablet-qr-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: "Origami FarmOS QR APK v0.1.${{ github.run_number }}"
          body: |
            **Build 0.1.${{ github.run_number }}** — commit ${{ github.sha }} on branch `${{ github.ref_name }}`.

            **Pre-release / on-farm test APK.** Animal QR quick entry uses a keyboard-wedge reader or typed tag. Built-in camera QR scanning, printable QR labels and secure photo attachments are not included. Do not use as a production veterinary decision system.

            The sign-in screen of this build shows `App 0.1.${{ github.run_number }} · <commit>` under
            the button. If a tablet shows a different number after installing, the
            install did not take.

            Signed with the committed debug key (`android/signing/debug.keystore`), so
            builds from here on install over each other in place. **If the tablet has a
            build from before that key existed, uninstall the app once first** — Android
            refuses to replace an app signed with a different key and says "App not
            installed". Every build after that updates without uninstalling.

            Fine for sideloading onto a test tablet, not for Play Store distribution.
            This prerelease has its own versioned tag and will not overwrite the existing tablet-apk-latest release.
          prerelease: true
          files: mobile/flutter_app/build/app/outputs/flutter-apk/*.apk
