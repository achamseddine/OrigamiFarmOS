name: Migrate & seed the production database

# Manual trigger only — this must never run on a push. It applies Alembic
# migrations and (optionally) the production seed script to a REAL
# database, so it only runs when someone explicitly asks for it from the
# Actions tab, with a database connection string that comes from a repo
# secret and is never written to a file or committed anywhere.
#
# One-time setup: add a repository secret named PROD_DATABASE_URL with
# the target database's connection string (Settings -> Secrets and
# variables -> Actions -> New repository secret). This workflow only
# reads that secret at run time; it is never logged (GitHub Actions
# automatically masks a secret's value in the log output).
#
# Put the whole connection string in the secret, including any options —
# for an Azure Postgres Flexible Server that means ending it with
# `?sslmode=require`, since the server refuses unencrypted connections.
# Keep the options *inside* the secret rather than appending them in a
# step: GitHub masks the exact secret value, and a string built from it
# would no longer match the mask and could surface in a log.
#
# The target database must also allow inbound connections from GitHub's
# hosted-runner IP ranges — an Azure Postgres Flexible Server blocks all
# public access by default, so its "Networking" settings need either
# "Allow public access from any Azure service" or a firewall rule wide
# enough to cover GitHub Actions' published IP ranges.
on:
  workflow_dispatch:
    inputs:
      action:
        description: "What to run"
        required: true
        default: migrate_and_seed
        type: choice
        options:
          - migrate_and_seed
          - migrate_only
          - seed_only

jobs:
  migrate-seed:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      # Turns the two likely setup failures — a missing secret and a
      # database that won't accept the runner — into a sentence instead of
      # a psycopg2 traceback. Prints nothing derived from the secret.
      - name: Check the database is reachable
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          python - <<'PY'
          import os, sys
          url = os.environ.get("DATABASE_URL", "")
          if not url:
              sys.exit(
                  "PROD_DATABASE_URL is not set. Add it under Settings -> Secrets and "
                  "variables -> Actions -> New repository secret, then re-run."
              )
          if url.startswith("sqlite"):
              sys.exit("PROD_DATABASE_URL points at SQLite. This workflow is for the real database.")
          import sqlalchemy
          try:
              with sqlalchemy.create_engine(url, connect_args={"connect_timeout": 15}).connect() as c:
                  version = c.exec_driver_sql("select version()").scalar()
              print("Connected:", str(version).split(" on ")[0])
          except Exception as exc:
              kind = type(exc).__name__
              hint = (
                  "The server did not accept the connection. On an Azure Postgres Flexible "
                  "Server the usual causes are (a) the firewall not allowing GitHub's runner "
                  "IPs — turn on 'Allow public access from any Azure service' or add a rule — "
                  "and (b) a connection string without '?sslmode=require'."
              )
              sys.exit(f"Could not connect ({kind}). {hint}")
          PY

      - name: Run Alembic migrations
        if: ${{ inputs.action == 'migrate_and_seed' || inputs.action == 'migrate_only' }}
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: alembic -c alembic.ini upgrade head

      - name: Seed the 5 real accounts (idempotent — skips if the farm already exists)
        if: ${{ inputs.action == 'migrate_and_seed' || inputs.action == 'seed_only' }}
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          python -m app.seed_production
          echo "::notice::Passwords were printed above, once. Save them now — this log is the only place they appear in plaintext. Consider deleting this run's log afterward (Actions run page -> ... -> Delete all logs) once you have them."
