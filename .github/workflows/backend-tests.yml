name: Backend tests

# Runs the backend suite on every push and pull request that touches the
# backend, the database (migrations, rendered schema) or the API contract.
# Besides the API and domain tests this proves three cross-cutting facts
# on each change:
#   - the Alembic chain and the ORM describe one schema, on SQLite and on
#     a real PostgreSQL 16 (tests/test_migrations.py);
#   - database/schema.sql is rendered from the current models and
#     api/openapi.yaml from the current application
#     (tests/test_generated_artifacts.py);
#   - the demo farm seeds onto the migrated schema.
on:
  push:
    branches:
      - claude/origami-farmos-tablet-mvp-u88i3e
      - main
    paths:
      - ".github/workflows/backend-tests.yml"
      - "backend/**"
      - "database/**"
      - "api/**"
  pull_request:
    paths:
      - ".github/workflows/backend-tests.yml"
      - "backend/**"
      - "database/**"
      - "api/**"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: farmos
          POSTGRES_PASSWORD: farmos
          POSTGRES_DB: farmos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U farmos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FARMOS_SCHEDULER: "false"
      # A disposable database the migration test may drop and recreate.
      FARMOS_TEST_POSTGRES_URL: postgresql://farmos:farmos@localhost:5432/farmos_test
      # The staging chain's backup and restore must run here, not be skipped:
      # it fails when pg_dump / pg_restore of the server's version are missing.
      FARMOS_REQUIRE_PG_TOOLS: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r requirements.txt

      # pg_dump / pg_restore of the service's own version, from the service's own
      # image: the runner's default client is newer (pg_dump 17 writes
      # `SET transaction_timeout`, which PostgreSQL 16 refuses on restore), and
      # its package sources may not carry postgresql-client-16 (Ubuntu 26.04).
      # PG_BIN points app/staging/pg_tools.py at these wrappers.
      - name: PostgreSQL 16 client tools (from the postgres:16 image)
        run: |
          bin="$RUNNER_TEMP/pg16"
          mkdir -p "$bin"
          for tool in pg_dump pg_restore; do
            printf '#!/bin/sh\nexec docker run --rm --network host --user %s -v /tmp:/tmp -v %s:%s -w /tmp postgres:16 %s "$@"\n' \
              "$(id -u):$(id -g)" "$RUNNER_TEMP" "$RUNNER_TEMP" "$tool" > "$bin/$tool"
            chmod +x "$bin/$tool"
          done
          echo "PG_BIN=$bin" >> "$GITHUB_ENV"
          "$bin/pg_dump" --version
          "$bin/pg_restore" --version

      - name: Generated files are current
        run: |
          python -m app.export_schema --check
          python -m app.export_openapi --check

      - name: Migrations, schema parity and the suite
        run: python -m pytest -q tests -p no:cacheprovider
