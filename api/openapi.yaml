      tags:
      - reports
      summary: Morning Briefing
      description: "Tech spec \xA716: \"Morning Briefing ... Local cache refresh on\
        \ app open\nand after sync.\" Refreshing recommendations here (not just from\n\
        GET /recommendations) means the briefing's priorities are current even\nif\
        \ nothing else has called the recommendations endpoint yet today."
      operationId: morning_briefing_api_v1_morning_briefing_get
      security:
      - HTTPBearer: []
      parameters:
      - name: farm_id
        in: query
        required: true
        schema:
          type: string
          title: Farm Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Morning Briefing Api V1 Morning Briefing Get
        '422':
          description: Validation Error
          content:
