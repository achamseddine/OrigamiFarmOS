  /api/v1/recommendations:
    get:
      tags:
      - recommendations
      summary: List Recommendations
      description: "GET /recommendations. By default re-evaluates every rule against\n\
        current farm state first (`refresh=true`) so the list is always\nevidence-fresh,\
        \ then returns what's stored \u2014 never generated without\npersisted evidence\
        \ (CONSTITUTION.md)."
      operationId: list_recommendations_api_v1_recommendations_get
      security:
      - HTTPBearer: []
      parameters:
      - name: farm_id
        in: query
        required: true
        schema:
          type: string
          title: Farm Id
      - name: category
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Category
      - name: status_filter
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Status Filter
      - name: refresh
        in: query
        required: false
        schema:
          type: boolean
          default: true
          title: Refresh
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RecommendationOut'
                title: Response List Recommendations Api V1 Recommendations Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/recommendations/{recommendation_id}/decision:
    patch:
      tags:
      - recommendations
      summary: Decide Recommendation
      description: "PATCH /recommendations/{id}/decision \u2014 accept/reject/postpone.\n\
        Tech spec \xA715 lifecycle: \"Generated -> Reviewed -> Accepted/Rejected/\n\
        Postponed -> Task Created -> Action Taken -> Outcome Recorded ->\nClosed.\"\
        \ Every decision is itself an event, so the trail is never lost."
      operationId: decide_recommendation_api_v1_recommendations__recommendation_id__decision_patch
      security:
      - HTTPBearer: []
      parameters:
      - name: recommendation_id
        in: path
        required: true
        schema:
          type: string
          title: Recommendation Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecommendationDecision'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
