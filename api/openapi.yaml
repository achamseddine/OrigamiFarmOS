openapi: 3.1.0
info:
  title: Origami FarmOS API
  description: Offline-first, tablet-first farm operating system API for Origami Farms.
    See CONSTITUTION.md and product/MVP_SCOPE.md in the repository root for the product
    principles this API enforces (evidence-based recommendations, worker-observes/manager-decides
    separation, event-sourced history).
  version: 0.1.0
paths:
  /:
    get:
      tags:
      - meta
      summary: Root
      operationId: root__get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Root  Get
  /health:
    get:
      tags:
      - meta
      summary: Health Check
      operationId: health_check_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Health Check Health Get
  /api/v1/auth/login:
    post:
      tags:
      - auth
      summary: Login
      operationId: login_api_v1_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/farms/{farm_id}/bootstrap:
    get:
      tags:
      - farms
      summary: Bootstrap
      description: "GET /farms/{farm_id}/bootstrap \u2014 initial local cache data\
        \ (tech spec\n\xA712). The tablet writes this straight into SQLite on first\
        \ login /\nwhen activating demo mode, per the offline-first flow in \xA710."
      operationId: bootstrap_api_v1_farms__farm_id__bootstrap_get
      security:
      - HTTPBearer: []
      parameters:
      - name: farm_id
        in: path
        required: true
        schema:
          type: string
          title: Farm Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BootstrapResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/sync/push:
    post:
      tags:
      - sync
      summary: Push
      description: "POST /sync/push \u2014 upload a batch of queued tablet writes.\n\
        \nTech spec \xA714: \"Duplicate idempotency key must not create duplicate\n\
        server record.\" Each item's `idempotency_key` is unique-constrained on\n\
        `sync_queue`, so replaying a batch after a dropped connection is safe.\n\n\
        Because every domain-row ID is generated client-side (a UUID, written\nonce\
        \ by `FarmWriteService` and never reused), the server can accept\nentity IDs\
        \ as-is with no remapping step \u2014 a deliberate simplification\nthat keeps\
        \ this push endpoint correct without needing a second\nID-translation pass.\n\
        \nThis build durably records every item (event + sync_queue row,\nidempotent)\
        \ and materializes the common write types the tablet already\nproduces (observations,\
        \ milk, tasks, feed transactions) back into\ntheir domain tables. Less common\
        \ event types are still accepted and\nqueued/event-logged, ready for a same-shaped\
        \ repository call to be\nadded \u2014 see README \"What remains\"."
      operationId: push_api_v1_sync_push_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncPushRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncPushResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/v1/sync/pull:
    get:
      tags:
      - sync
      summary: Pull
      description: "GET /sync/pull \u2014 changes since `cursor` (tech spec \xA712)."
      operationId: pull_api_v1_sync_pull_get
      security:
      - HTTPBearer: []
      parameters:
      - name: farm_id
        in: query
        required: true
        schema:
          type: string
          title: Farm Id
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: ISO-8601 timestamp; events after this are returned
          title: Cursor
        description: ISO-8601 timestamp; events after this are returned
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 500
          default: 100
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncPullResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
