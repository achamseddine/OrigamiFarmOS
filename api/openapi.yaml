openapi: 3.1.0
info:
  title: Origami FarmOS API
  description: Offline-first, tablet-first farm operating system API for Origami Farms. See CONSTITUTION.md
    and product/MVP_SCOPE.md in the repository root for the product principles this API enforces (evidence-based
    recommendations, worker-observes/manager-decides separation, event-sourced history).
  version: 0.1.0
paths:
  /:
    get:
      tags:
      - meta
      summary: Root
      operationId: root__get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Root  Get
  /health:
    get:
      tags:
      - meta
      summary: Health Check
      operationId: health_check_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Health Check Health Get
  /api/v1/auth/login:
    post:
      tags:
      - auth
      summary: Login
      operationId: login_api_v1_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/me:
    get:
      tags:
      - auth
      summary: Me
      description: 'Lets the mobile app restore a session from its stored token on

        relaunch ("log in once, stay logged in") without re-sending a

        password — it just re-validates the bearer token and returns the

        current profile.'
      operationId: me_api_v1_auth_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileOut'
      security:
      - HTTPBearer: []
  /api/v1/users:
    get:
      tags:
      - users
      summary: List Users
      description: 'The farm''s staff roster — used by the manager''s Team screen and by

        the task-assignment picker. Always scoped to the caller''s own farm

        (never accepts a farm_id param) so one account can never enumerate

        another farm''s staff.'
      operationId: list_users_api_v1_users_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/UserProfileOut'
                type: array
                title: Response List Users Api V1 Users Get
      security:
      - HTTPBearer: []
  /api/v1/modules/catalog:
    get:
      tags:
      - employees
      summary: Module Catalog
      description: 'Every module the product has, with whether this farm''s licence for

        it is active (tech spec §10 — modules can be switched off per farm''s

        subscription). Any signed-in user may read it; it describes the

        product, not the farm''s data.'
      operationId: module_catalog_api_v1_modules_catalog_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ModuleCatalogEntry'
                type: array
                title: Response Module Catalog Api V1 Modules Catalog Get
      security:
      - HTTPBearer: []
  /api/v1/me/access:
    get:
      tags:
      - employees
      summary: My Access
      operationId: my_access_api_v1_me_access_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyAccessOut'
      security:
      - HTTPBearer: []
  /api/v1/employees:
    get:
      tags:
      - employees
      summary: List Employees
      operationId: list_employees_api_v1_employees_get
      security:
      - HTTPBearer: []
      parameters:
      - name: include_inactive
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Include Inactive
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EmployeeDetailOut'
                title: Response List Employees Api V1 Employees Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - employees
      summary: Create Employee
      operationId: create_employee_api_v1_employees_post
      security:
      - HTTPBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeDetailOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/employees/{employee_id}:
    get:
      tags:
      - employees
      summary: Get Employee
      operationId: get_employee_api_v1_employees__employee_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: employee_id
        in: path
        required: true
        schema:
          type: string
          title: Employee Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeDetailOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - employees
      summary: Update Employee
      operationId: update_employee_api_v1_employees__employee_id__patch
      security:
      - HTTPBearer: []
      parameters:
      - name: employee_id
        in: path
        required: true
        schema:
          type: string
          title: Employee Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeDetailOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - employees
      summary: Deactivate Employee
      description: 'Deactivates rather than deletes: an employee''s name is attached to

        every record they ever entered, and the Constitution''s "history is

        never silently deleted" applies to who did the work too.'
      operationId: deactivate_employee_api_v1_employees__employee_id__delete
      security:
      - HTTPBearer: []
      parameters:
      - name: employee_id
        in: path
        required: true
        schema:
          type: string
          title: Employee Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
