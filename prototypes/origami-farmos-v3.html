const STORAGE='origami_farmos_animals_v2', navigation=[['overview','▦','Overview'],['day','☀','My Day'],['animals','♞','Animals'],['feed','♧','Feed & Nutrition'],['production','◫','Production'],['health','♡','Health & Vet'],['inventory','▤','Inventory'],['crops','♣','Crops & Fields'],['finance','$','Finance'],['intelligence','✧','Intelligence']];

 {id:'a3',tag:'SHEEP-001',name:'Sheep 001',species:'Sheep',breed:'',sex:'Female',birthDate:'',acquired:'',status:'Active',purpose:'Breeding',group:'Sheep',color:'',photo:'',notes:'Example animal only.',demo:true,createdAt:'2026-11-10T00:00:00Z'},

function initialState(){try{let s=localStorage.getItem(STORAGE);if(s){let d=JSON.parse(s);if(d && Array.isArray(d.animals) && Array.isArray(d.events))return {...structuredClone(demoSeed),...d};}}catch(ex){console.warn('Storage unavailable',ex)}return structuredClone(demoSeed)}
let db=initialState(),page='animals',selectedAnimalId=null,animalTab='overview',filterSpecies='all',filterStatus='Active',filterSearch='',feedTab='mixes',role='admin',language='en',timelineFilter='all';

const heading=(ey,title,desc,actions='')=>`<div class="head"><div><div class="eyebrow">${ey}</div><h1>${title}</h1><p class="sub">${desc}</p></div><div class="row wrap">${actions}</div></div>`;
const empty=(icon,text,button='')=>`<div class="empty"><div class="symbol" style="margin:auto auto 10px">${icon}</div><strong>${text}</strong>${button?`<p>${button}</p>`:''}</div>`;
const field=(label,name,type='text',opts={})=>`<div class="field ${opts.full?'full':''}"><label for="f_${name}">${label}${opts.required?' *':''}</label>${opts.options?`<select id="f_${name}" name="${name}" ${opts.required?'required':''}>${opts.options.map(o=>`<option value="${e(o)}" ${String(opts.value??'')===String(o)?'selected':''}>${e(o)}</option>`).join('')}</select>`:type==='textarea'?`<textarea id="f_${name}" name="${name}" ${opts.required?'required':''} placeholder="${e(opts.placeholder||'')}">${e(opts.value??'')}</textarea>`:`<input id="f_${name}" name="${name}" type="${type}" ${opts.required?'required':''} ${opts.step?'step="'+opts.step+'"':''} ${opts.min!=null?'min="'+opts.min+'"':''} ${opts.max!=null?'max="'+opts.max+'"':''} ${opts.accept?'accept="'+opts.accept+'"':''} value="${e(opts.value??'')}" placeholder="${e(opts.placeholder||'')}">`}${opts.hint?`<small>${opts.hint}</small>`:''}</div>`;
function persist(){try{localStorage.setItem(STORAGE,JSON.stringify(db));return true}catch(err){alert('Unable to save locally. Browser storage may be full. Export your data and reduce photo sizes.');return false}}
function notify(message){let toast=document.getElementById('toast');if(!toast){toast=document.createElement('div');toast.id='toast';document.body.appendChild(toast)}toast.textContent=message;toast.style.display='block';clearTimeout(notify.timer);notify.timer=setTimeout(()=>toast.style.display='none',3100)}
function audit(action,animalId,summary){db.audit.unshift({id:eid(),action,animalId,summary,date:new Date().toISOString(),actor:roleLabels[role]});}
function addEvent(item){db.events.unshift({...item,id:eid(),createdAt:new Date().toISOString(),actor:roleLabels[role],voided:false});persist();notify('Record saved in this browser');closeModal();render()}
function navigate(p){page=p;if(p==='animals')selectedAnimalId=null;render();window.scrollTo(0,0)}
function openAnimal(id,tab='overview'){selectedAnimalId=id;animalTab=tab;page='animals';timelineFilter='all';render();window.scrollTo(0,0)}
function selectTab(t){animalTab=t;render()}
function renderNav(){document.getElementById('nav').innerHTML=navigation.map(([id,icon,label])=>`<button class="navbtn ${page===id?'active':''}" onclick="navigate('${id}')"><span class="ico">${icon}</span><span class="txt">${label}</span></button>`).join('');document.getElementById('bottomnav').innerHTML=[navigation[0],navigation[1],navigation[2],navigation[3],navigation[9]].map(([id,icon,label])=>`<button class="${page===id?'active':''}" onclick="navigate('${id}')"><span>${icon}</span>${label}</button>`).join('');document.getElementById('crumb').textContent=page==='animals'&&selectedAnimalId?animal(selectedAnimalId)?.tag||'Animal':navigation.find(n=>n[0]===page)?.[2]||page}
function render(){renderNav();let screens={overview,day,animals,feed,production,health,inventory,crops,finance,operations,intelligence};document.getElementById('screen').innerHTML=screens[page]();let sel=document.getElementById('role');if(sel)sel.value=role;document.documentElement.lang=language;document.body.dir=language==='ar'?'rtl':'ltr'}
function changeRole(v){role=v;closeModal();render();notify(`Demo role: ${roleLabels[role]} — UI restrictions only`)}
function toggleLanguage(){language=language==='en'?'ar':'en';document.getElementById('lang').textContent=language==='ar'?'EN':'عربي';render();notify(language==='ar'?'تم تفعيل العرض من اليمين إلى اليسار؛ الترجمة الجزئية تجريبية':'English layout enabled')}
function avatar(a,small=false){return a.photo?`<img class="avatar ${small?'sm':''}" src="${e(a.photo)}" alt="Photo of ${e(a.tag)}">`:`<div class="avatar ${small?'sm':''}" aria-label="${e(a.species)}">${speciesEmoji[a.species]||'🐾'}</div>`}
function registryFilters(){let all=db.animals.filter(a=>(filterSpecies==='all'||a.species===filterSpecies)&&(filterStatus==='all'||a.status===filterStatus)&&(!filterSearch||[a.name,a.tag,a.breed,a.group].join(' ').toLowerCase().includes(filterSearch.toLowerCase())));return all.sort((a,b)=>a.tag.localeCompare(b.tag))}
function animals(){if(selectedAnimalId){const a=animal(selectedAnimalId);if(a)return twin(a);selectedAnimalId=null}const list=registryFilters();return heading('ANIMAL MANAGEMENT','Animal Registry','Register every animal, manage identity, and open a longitudinal digital twin.',canAdmin()?btn('+ Add animal',"openForm('animal')",'primary'):tag('View + record access','gray'))+
`<div class="notice">${db.animals.filter(a=>a.demo).length} <b>illustrative sample animals</b>. Your reported herd totals are reference figures, not loaded individual records. Browser-local demo data survives reloads on this device; no cloud sync.</div>`+
`<div class="grid four section">${metric('Registry',db.animals.length,'Profiles entered in demo')}${metric('Active',activeAnimals().length,'Registered active animals')}${metric('Species',new Set(db.animals.map(a=>a.species)).size,'Represented in registry')}${metric('Recorded events',db.events.filter(x=>!x.voided).length,'Linked to individual animals')}</div>`+
`<div class="controls"><input id="searchAnimals" type="search" placeholder="Search by tag, name, breed or group" value="${e(filterSearch)}" oninput="filterSearch=this.value;updateAnimalList()" aria-label="Search animals"><select aria-label="Species filter" onchange="filterSpecies=this.value;updateAnimalList()"><option value="all">All species</option>${speciesOptions.map(s=>`<option ${filterSpecies===s?'selected':''}>${e(s)}</option>`).join('')}</select><select aria-label="Status filter" onchange="filterStatus=this.value;updateAnimalList()">${['Active','Archived','Deceased','Sold','all'].map(x=>`<option value="${x}" ${filterStatus===x?'selected':''}>${x==='all'?'All statuses':x}</option>`).join('')}</select>${btn('⇩ Export JSON','exportData()','soft')}</div><div id="animalList">${renderAnimalList(list)}</div>`}
function updateAnimalList(){document.getElementById('animalList').innerHTML=renderAnimalList(registryFilters())}
function renderAnimalList(list){return list.length?`<div class="animal-grid">${list.map(a=>`<button class="animal-card" onclick="openAnimal('${a.id}')">${avatar(a)}<div class="animal-info"><div class="id">${e(a.tag)} ${a.demo?'· DEMO':''}</div><h3>${e(a.name||a.tag)}</h3><div class="sub">${e(a.species)}${a.breed?' · '+e(a.breed):''}<br>${e(a.sex)}${a.group?' · '+e(a.group):''}</div><div class="card-bottom">${tag(a.status,a.status==='Active'?'':'gray')}${a.purpose?tag(a.purpose,'gray'):''}</div></div></button>`).join('')}</div>`:empty('🔎','No animals match the filters.',canAdmin()?'Use Add animal to create a profile.':'Try a different search.')}
function latest(id,type){return animalEvents(id,type)[0]||null}
function pregnancyState(id){const ev=animalEvents(id,'repro').filter(x=>['Pregnancy confirmed','Pregnancy negative','Pregnancy check','Insemination / service','Calving','Abortion / pregnancy loss'].includes(x.action));if(!ev.length)return 'Not recorded';let v=ev[0];return ({'Pregnancy confirmed':'Confirmed pregnant','Pregnancy negative':'Not pregnant','Pregnancy check':v.result||'Check recorded','Insemination / service':'Served · unconfirmed','Calving':'Calved · status pending','Abortion / pregnancy loss':'Pregnancy loss recorded'})[v.action]||'Not recorded'}
function totalMilk(id,days=7){let start=new Date(today()+'T00:00:00');start.setDate(start.getDate()-(days-1));return animalEvents(id,'milk').filter(r=>new Date(r.date+'T12:00:00')>=start).reduce((s,r)=>s+Number(r.liters||0),0)}
function activeWithdrawals(id){let todays=today();return animalEvents(id,'medication').filter(r=>r.withdrawalStatus==='Pending veterinary verification'||(r.milkUntil&&r.milkUntil>=todays)||(r.meatUntil&&r.meatUntil>=todays)||(r.startDate<=todays&&r.endDate>=todays))}
function krow(k,v){return `<div class="key-value"><span>${k}</span><strong>${v}</strong></div>`}
function twin(a){const w=latest(a.id,'weight'),milk=latest(a.id,'milk'),ev=animalEvents(a.id),meds=activeWithdrawals(a.id);const actions=`${canAdmin()?btn('✎ Edit profile',`openForm('animal','${a.id}')`):''}${a.status==='Active'?btn('＋ Record',`openForm('record','${a.id}')`,'primary'):tag('Inactive · view only','gray')}`;const tabs=[['overview','Overview'],['milk','Milk'],['feed','Feed intake'],['weight','Weight & BCS'],['repro','Reproduction'],['health','Health & meds'],['timeline','Timeline']];return `<div class="row wrap" style="margin-bottom:15px">${btn('← Animal Registry',"selectedAnimalId=null;render()",'soft')}<span class="sub">Animal Digital Twin / ${e(a.tag)} ${a.demo?'· sample':''}</span></div>`+
`<div class="detail-top">${avatar(a)}<div class="info"><div class="eyebrow">${e(a.species)} · ${e(a.tag)} ${a.demo?'· DEMO':''}</div><h1>${e(a.name||a.tag)}</h1><div class="row start wrap">${tag(a.status,a.status==='Active'?'':'gray')}${tag(a.sex,'gray')}${a.group?tag(a.group,'gray'):''}${tag(pregnancyState(a.id),'gray')}</div><div class="sub" style="margin-top:10px">${e(a.breed||'Breed not entered')} · ${a.birthDate?'Born '+fmtDate(a.birthDate):'Birth date not recorded'}</div></div><div class="detail-actions">${actions}</div></div>`+
(meds.length?`<div class="notice red section"><strong>Withdrawal review required:</strong> ${meds.map(m=>e(m.drug)+(m.withdrawalStatus==='Pending veterinary verification'?' · NOT VERIFIED':'')+(m.milkUntil?' · Milk until '+fmtDate(m.milkUntil):'')+(m.meatUntil?' · Meat until '+fmtDate(m.meatUntil):'')).join('; ')}. Do not assume animal products are safe from unverified or absent dates; this prototype does not calculate withdrawal periods.</div>`:'')+
`<div class="detail-cards">${metric('Milk · last 7 days',milkEligible(a)?(milk?totalMilk(a.id).toFixed(1)+' L':'—'):'N/A',milkEligible(a)?'Recorded entries only':'Not a milking animal')}${metric('Latest body weight',w?fmt(w.kg)+' kg':'—',w?'Measured '+fmtDate(w.date):'Not yet recorded')}${metric('Pregnancy',pregnancyState(a.id),'Based on recorded events')}${metric('Recorded activity',ev.length,'Linked events')}</div>`+
`<div class="tabs" role="tablist">${tabs.map(([id,title])=>`<button role="tab" aria-selected="${animalTab===id}" class="${animalTab===id?'selected':''}" onclick="selectTab('${id}')">${title}</button>`).join('')}</div>`+
({overview:overviewTwin,milk:milkTwin,feed:feedTwin,weight:weightTwin,repro:reproTwin,health:healthTwin,timeline:timelineTwin}[animalTab])(a)}
function overviewTwin(a){const wt=latest(a.id,'weight'),milk=latest(a.id,'milk'),ev=animalEvents(a.id).slice(0,4);let required=[['Weight',!!wt],['Current milk',!!milk||!milkEligible(a)],['Body condition',!!wt?.bcs],['Lactation date',!!a.lastCalving],['Feed analysis',false]].filter(x=>!x[1]).map(x=>x[0]);return `<div class="grid two">${card('Identity & lifecycle',`${krow('Tag',e(a.tag))}${krow('Breed',e(a.breed)||'—')}${krow('Birth date',fmtDate(a.birthDate))}${krow('Sex',e(a.sex))}${krow('Purpose / group',e(a.purpose||'—')+' / '+e(a.group||'—'))}${krow('Last calving',fmtDate(a.lastCalving))}${krow('Latest BCS',wt?.bcs?e(wt.bcs)+' / 5':'—')}${krow('Acquired',fmtDate(a.acquired))}${a.notes?`<p class="sub">${e(a.notes)}</p>`:''}`)}${card('Nutrition readiness',`<div class="row wrap">${tag('Engine not connected','warn')}<span class="sub">Read-only readiness check</span></div><p class="sub">Individual ration calculation will use weight, lactation, milk production, pregnancy, health restrictions and measured feed composition. It does not calculate kilograms here.</p>${required.length?`<div class="notice amber">Missing / not connected: ${e(required.join(', '))}.</div>`:tag('Inputs recorded · calculation still unavailable','warn')}<div style="margin-top:16px">${btn('Go to feed history',"selectTab('feed')",'soft')}</div>`)} </div>`+
`<div class="grid two section">${card('Most recent events',ev.length?ev.map(eventLine).join(''):empty('🕓','No activity has been recorded yet.'))}${card('Quick record',`<div class="quick">${[['milk','🥛','Milk'],['feed','🌾','Feeding'],['weight','⚖','Weight'],['observation','♡','Observation']].filter(([x])=>x!=='milk'||milkEligible(a)).map(([x,icon,title])=>`<button onclick="openForm('${x}','${a.id}')"><i>${icon}</i>${title}</button>`).join('')}</div>`)}</div>`}
function chartMilk(a){let dates=[];for(let i=6;i>=0;i--){let dt=new Date(today()+'T12:00:00');dt.setDate(dt.getDate()-i);let s=dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');dates.push(s)}const values=dates.map(d=>animalEvents(a.id,'milk').filter(r=>r.date===d).reduce((v,r)=>v+Number(r.liters),0));const max=Math.max(1,...values);return `<div class="mini-chart">${dates.map((dt,i)=>`<div class="baritem" title="${fmtDate(dt)}: ${fmt(values[i])} L"><div class="fill" style="height:${Math.max(3,Math.round(values[i]/max*100))}%"></div><span>${dt.slice(5)}</span></div>`).join('')}</div><div class="sub">Milk entries summed by day; zero means no recorded entry, not confirmed zero production.</div>`}
function tableEvents(id,type,cols,fn){let all=animalEvents(id,type);return all.length?`<div class="tablewrap"><table><thead><tr>${cols.map(c=>`<th>${c}</th>`).join('')}<th>Audit</th></tr></thead><tbody>${all.map(r=>`<tr>${fn(r)}<td>${canAdmin()?btn('Void',`voidEvent('${r.id}')`,'tiny danger'):tag('Recorded','gray')}</td></tr>`).join('')}</tbody></table></div>`:empty('🗓','No records yet. Use Add record to start a timeline.')}
function milkTwin(a){if(!milkEligible(a))return card('Milk production',empty('🥛','Milk entry is available for female cattle, goats and sheep.'));let records=animalEvents(a.id,'milk'),sum=totalMilk(a.id);return `${heading('PRODUCTION HISTORY','Milk production',`${e(a.tag)} · per-milking recordings`,btn('+ Record milk',`openForm('milk','${a.id}')`,'primary'))}<div class="grid two">${card('Last 7 days',`${chartMilk(a)}`)}${card('Recorded summary',`${krow('Total (7 days)',fmt(sum)+' L')}${krow('Recorded sessions',String(records.length))}${krow('Latest milking',records.length?fmtDate(records[0].date)+' · '+e(records[0].session):'—')}${krow('Fat / protein test','Not recorded in demo')}`)}</div><div class="section">${card('Milking sessions',tableEvents(a.id,'milk',['Date','Session','Litres','Note'],r=>`<td>${fmtDate(r.date)}</td><td>${e(r.session)}</td><td><strong>${fmt(r.liters)} L</strong></td><td>${e(r.note||'—')}</td>`))}</div>`}
function feedTwin(a){const recs=animalEvents(a.id,'feed');let weekStart=new Date(today()+'T00:00:00');weekStart.setDate(weekStart.getDate()-6);let s=recs.filter(r=>new Date(r.date+'T12:00:00')>=weekStart).reduce((v,r)=>v+Number(r.offered),0);return `${heading('ACTUAL FEED EVENTS','Feed intake','Offered, refused and estimated intake, linked to this animal.',btn('+ Record feeding',`openForm('feed','${a.id}')`,'primary'))}<div class="grid three">${metric('Offered · 7 days',fmt(s)+' kg','Recorded as-fed weights')}${metric('Feed events',recs.length,'Individual animal entries')}${metric('Approved ration','—','Optimizer not implemented')}</div><div class="section">${card('Feeding history',tableEvents(a.id,'feed',['Date','Feed / mix','Offered','Refused','Estimated consumed'],r=>`<td>${fmtDate(r.date)}<div class="mini muted">${e(r.meal||'')}</div></td><td>${e(r.source)}</td><td>${fmt(r.offered)} kg</td><td>${r.refused==null?'Not measured':fmt(r.refused)+' kg'}</td><td>${r.refused==null?'Unknown':fmt(Math.max(0,r.offered-r.refused))+' kg'}</td>`))}<div class="notice" style="margin-top:13px">No real inventory deduction occurs in this HTML prototype. Numbered mix and ingredient-lot tracking, approved nutrition calculations, and stock-ledger postings must connect to the backend before operational use.</div></div>`}
function weightTwin(a){let rows=animalEvents(a.id,'weight'),w=rows[0];return `${heading('BODY CONDITION','Weight & body score','Follow changes in measured liveweight and body condition.',btn('+ Record weight',`openForm('weight','${a.id}')`,'primary'))}<div class="grid three">${metric('Latest weight',w?fmt(w.kg)+' kg':'—',w?fmtDate(w.date):'No measurement')}${metric('Latest BCS',w?.bcs?e(w.bcs)+' / 5':'—','Body condition scale 1–5')}${metric('Measurements',rows.length,'Historical measurements')}</div><div class="section">${card('Weight & condition history',tableEvents(a.id,'weight',['Date','Weight','BCS','Method / note'],r=>`<td>${fmtDate(r.date)}</td><td>${fmt(r.kg)} kg</td><td>${r.bcs?e(r.bcs):'—'}</td><td>${e(r.method||'—')}<div class="mini muted">${e(r.note||'')}</div></td>`))}</div>`}
function reproTwin(a){let rows=animalEvents(a.id,'repro');return `${heading('REPRODUCTIVE LIFE','Pregnancy & reproduction','Record service, checks, calving and pregnancy outcomes.',canVet()?btn('+ Reproduction event',`openForm('repro','${a.id}')`,'primary'):tag('Vet / admin editing','gray'))}<div class="grid three">${metric('Current state',e(pregnancyState(a.id)),'Based on the latest relevant event')}${metric('Last calving',fmtDate(a.lastCalving),'Profile date')}${metric('Reproductive events',rows.length,'Recorded history')}</div><div class="section">${card('Reproductive timeline',rows.length?rows.map(r=>`<div class="item"><div class="symbol">${r.action?.includes('Pregnancy')?'🧬':'📅'}</div><div class="details"><strong>${e(r.action)}</strong><small>${fmtDate(r.date)}${r.result?' · '+e(r.result):''}${r.expectedDate?' · Expected: '+fmtDate(r.expectedDate):''}${r.sire?' · Sire: '+e(r.sire):''}<br>${e(r.note||'')}</small></div>${canAdmin()?btn('Void',`voidEvent('${r.id}')`,'tiny danger'):''}</div>`).join(''):empty('🧬','No reproductive records for this animal.'))}<div class="notice" style="margin-top:13px">Pregnancy status is a record of examinations and events—not an automated diagnosis. Expected calving dates are entered manually and must be verified clinically.</div></div>`}
function healthTwin(a){let obs=animalEvents(a.id,'observation'),clinical=animalEvents(a.id,'clinical'),meds=animalEvents(a.id,'medication');return `${heading('HEALTH & VETERINARY','Health & medications','Observations, clinical assessments, medication and withdrawal records.',`<div class="row wrap">${btn('+ Observation',`openForm('observation','${a.id}')`)}${canVet()?btn('+ Clinical visit',`openForm('clinical','${a.id}')`):''}${canVet()?btn('+ Medication',`openForm('medication','${a.id}')`,'primary'):''}</div>`)}<div class="grid three">${metric('Observations',obs.length,'Worker and vet records')}${metric('Clinical visits',clinical.length,'Professional assessments')}${metric('Medications',meds.length,'Treatment entries')}</div><div class="grid two section">${card('Observations & clinical visits',[...obs,...clinical].sort((x,y)=>y.date.localeCompare(x.date)).map(r=>`<div class="item"><div class="symbol">${r.type==='clinical'?'🩺':'♡'}</div><div class="details"><strong>${e(r.type==='clinical'?'Clinical: '+r.diagnosis:r.category)}</strong><small>${fmtDate(r.date)} · ${e(r.severity||'')}${r.temperature?' · '+e(r.temperature)+' °C':''}<br>${e(r.note||r.plan||'')}${r.vet?' · '+e(r.vet):''}</small></div>${canAdmin()?btn('Void',`voidEvent('${r.id}')`,'tiny danger'):''}</div>`).join('')||empty('🩺','No health events recorded.'))}${card('Medication & withdrawal',meds.map(r=>`<div class="item"><div class="symbol">💊</div><div class="details"><strong>${e(r.drug)}</strong><small>${e(r.dose)} · ${e(r.route)} · ${e(r.frequency||'')}<br>${fmtDate(r.startDate)} to ${fmtDate(r.endDate)} · ${e(r.vet||'Veterinarian not specified')}<br>Milk hold: ${r.milkUntil?fmtDate(r.milkUntil):'Not entered'} · Meat hold: ${r.meatUntil?fmtDate(r.meatUntil):'Not entered'}<br>${e(r.note||'')}</small></div>${canAdmin()?btn('Void',`voidEvent('${r.id}')`,'tiny danger'):''}</div>`).join('')||empty('💊','No medication records yet.'))}</div><div class="notice amber section">Medication dose and withdrawal dates must be supplied or verified by a veterinarian. This interface is a record-keeping prototype, not a prescribing or withdrawal-calculation tool.</div>`}
function eventLabel(r){let labels={milk:`Milk · ${fmt(r.liters)} L (${e(r.session)})`,feed:`Feed · ${fmt(r.offered)} kg offered (${e(r.source)})`,weight:`Weight · ${fmt(r.kg)} kg${r.bcs?' · BCS '+e(r.bcs):''}`,repro:`Reproduction · ${e(r.action)}`,observation:`Observation · ${e(r.category)}`,clinical:`Clinical visit · ${e(r.diagnosis)}`,medication:`Medication · ${e(r.drug)}`};return labels[r.type]||r.type}
function eventLine(r){return `<div class="item"><div class="symbol">${({milk:'🥛',feed:'🌾',weight:'⚖',repro:'🧬',observation:'♡',clinical:'🩺',medication:'💊'})[r.type]||'🗒'}</div><div class="details"><strong>${eventLabel(r)}</strong><small>${fmtDate(r.date)} · ${e(r.actor||'Recorded')}<br>${e(r.note||'')}</small></div></div>`}

function overview(){const recordedMilk=db.events.filter(x=>x.type==='milk'&&!x.voided),milkTotal=recordedMilk.reduce((s,x)=>s+Number(x.liters),0);return heading('FARM COMMAND CENTER','Your farm, one picture','Recorded demo activity appears below; reference production figures are separately labeled.',btn('+ Record activity',"openForm('record')",'primary'))+

async function compressPhoto(file){if(!file)return null;if(!['image/jpeg','image/png','image/webp'].includes(file.type))throw Error('Upload JPG, PNG or WEBP images only.');if(file.size>6*1024*1024)throw Error('Image too large. Maximum 6 MB.');let temp=URL.createObjectURL(file);try{const image=await new Promise((resolve,reject)=>{const pic=new Image();pic.onload=()=>resolve(pic);pic.onerror=()=>reject(Error('Could not read the selected image.'));pic.src=temp});let ratio=Math.min(1,1050/Math.max(image.width,image.height)),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(image.width*ratio));canvas.height=Math.max(1,Math.round(image.height*ratio));let ctx=canvas.getContext('2d');ctx.fillStyle='#ffffff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(image,0,0,canvas.width,canvas.height);return canvas.toDataURL('image/jpeg',.71);}finally{URL.revokeObjectURL(temp)}}
async function submitAnimal(ev,id){ev.preventDefault();if(!canAdmin())return errorForm('Only Admin may edit animal profiles.');const f=new FormData(ev.target),tagCode=String(f.get('tag')).trim().toUpperCase();if(!/^[A-Z0-9][A-Z0-9_-]{1,39}$/.test(tagCode))return errorForm('Tag must be 2–40 characters: letters, digits, hyphens or underscores.');if(db.animals.some(x=>x.tag.toUpperCase()===tagCode&&x.id!==id))return errorForm('This animal tag already exists. Use a unique tag.');const old=id?animal(id):null;if(old&&!old.id)return errorForm('Animal not found.');if(old&&old.species!==f.get('species')&&animalEvents(id).length)return errorForm('Species cannot change once animal events are recorded.');if(old&&old.sex==='Female'&&f.get('sex')!=='Female'&&animalEvents(id).some(x=>['milk','repro'].includes(x.type)))return errorForm('Sex change conflicts with recorded milk or reproduction history.');if(f.get('birthDate')&&f.get('birthDate')>today())return errorForm('Birth date cannot be in the future.');if(f.get('lastCalving')&&f.get('birthDate')&&f.get('lastCalving')<f.get('birthDate'))return errorForm('Last calving cannot predate birth.');let image=old?.photo||'';if(f.get('removePhoto'))image='';try{const file=ev.target.querySelector('input[name=photo]')?.files[0];if(file)image=await compressPhoto(file)}catch(error){return errorForm(error.message)}const keys=['name','species','breed','sex','status','purpose','group','birthDate','acquired','lastCalving','color','notes'],values={tag:tagCode,photo:image};keys.forEach(k=>values[k]=String(f.get(k)||'').trim());let changed=[];
if(old){for(let [k,v]of Object.entries(values))if((old[k]||'')!==v)changed.push(k);if(!changed.length){closeModal();notify('No changes to save');return}Object.assign(old,values,{demo:false,updatedAt:new Date().toISOString()});audit('Profile updated',id,'Changed: '+changed.join(', '));}else{let animalId=eid();db.animals.unshift({...values,id:animalId,demo:false,createdAt:new Date().toISOString()});audit('Animal registered',animalId,'Tag '+tagCode+' · '+values.species);id=animalId;}
if(!persist())return;closeModal();notify(old?'Animal profile updated':'Animal registered');openAnimal(id)}

function v3Insights(){let alerts=[];
 for(const a of db.animals.filter(x=>x.status==='Active')){const ms=animalEvents(a.id,'milk'),byDate=new Map();for(const r of ms)byDate.set(r.date,(byDate.get(r.date)||0)+r.liters);const sorted=[...byDate.entries()].sort((x,y)=>y[0].localeCompare(x[0]));if(sorted.length>=4){const prior=sorted.slice(1,4),base=v3sum(prior,x=>x[1])/prior.length;const last=sorted[0];if(base>0&&last[1]<base*0.8)alerts.push({type:'Milk trend',level:'Review',date:last[0],title:a.tag+' · recorded milk lower than prior entries',body:`Latest logged day ${fmt(last[1])} L versus prior three recorded days average ${fmt(base)} L. Missing sessions, illness, stage of lactation and changes in milking routine may explain differences.`,animalId:a.id});}
 if(activeWithdrawals(a.id).length)alerts.push({type:'Medication review',level:'Warning',date:today(),title:a.tag+' · withdrawal / treatment flag',body:'Medication record is active, has pending veterinary verification or has a withdrawal-until date not yet elapsed. Food-safety status requires veterinary review.',animalId:a.id});
 }
 for(const l of v3stockAlertLots()){let b=v3lotBalance(l);if(l.quality==='Quarantined')alerts.push({type:'Inventory',level:'Warning',date:today(),title:l.code+' · lot quarantined',body:'Do not use the quarantined lot in a feed batch.',tab:'inventory'});else if(v3lotExpiry(l))alerts.push({type:'Inventory',level:'Warning',date:l.expiry,title:l.code+' · lot past expiry date',body:'Review lot eligibility before any further use.',tab:'inventory'});else alerts.push({type:'Inventory',level:'Review',date:today(),title:l.code+' · below threshold',body:`Remaining ${fmt(b)} ${l.unit}; threshold ${fmt(l.lowThreshold)} ${l.unit}.`,tab:'inventory'});}
 for(const c of db.healthCases.filter(x=>x.status==='Open'&&x.followUp&&x.followUp<=today()))alerts.push({type:'Veterinary follow-up',level:'Review',date:c.followUp,title:(animal(c.animalId)?.tag||'Animal')+' · follow-up due',body:c.title,animalId:c.animalId});
 for(const w of db.workOrders.filter(v3Due))alerts.push({type:'Operations',level:'Review',date:w.due,title:'Overdue task · '+w.title,body:'Assigned to '+(w.assignedTo||'unassigned'),tab:'operations'});
 return alerts.sort((a,b)=>(a.level==='Warning'?0:1)-(b.level==='Warning'?0:1)||String(b.date).localeCompare(String(a.date)))}
function v3MissingInputs(){let cattle=db.animals.filter(x=>x.status==='Active'&&x.species==='Dairy cattle');return cattle.map(a=>{let missing=[];if(!latest(a.id,'weight'))missing.push('weight');if(!latest(a.id,'milk'))missing.push('individual milk');if(!a.lastCalving)missing.push('days in milk');if(!db.lots.some(l=>['Feed ingredient','Forage'].includes(l.category)&&String(l.notes||'').match(/dry matter|nDF|protein/i)))missing.push('verified feed analysis');return {animalId:a.id,tag:a.tag,missing}})}
function intelligence(){const alerts=v3Insights(),missing=v3MissingInputs(),ready=missing.filter(x=>!x.missing.length).length;return heading('DECISION SUPPORT','Origami Intelligence','Rule-based, evidence-linked demo signals with explicit data gaps. No generative veterinary or nutrition decisions.',btn('Open feed planner',"feedTab='planner';navigate('feed')",'soft'))+`<div class="grid four">${metric('Recorded signals',alerts.length,'Transparent demo rules')}${metric('Withdrawal flags',alerts.filter(x=>x.type==='Medication review').length,'Vet safety review')}${metric('Dairy animals',missing.length,'Nutrition data review')}${metric('Ration engine','Not connected','Validated solver required')}</div>${v3tab([['signals','Review signals'],['readiness','Data quality'],['method','Logic & safeguards']],intelligenceTab,'intelligenceTab')}${intelligenceTab==='signals'?card('Signals that need human review',`${alerts.length?alerts.map(a=>`<div class="insight"><div class="row wrap"><span>${a.level==='Warning'?tag('Warning','red'):tag('Review','warn')}</span><span class="mini muted">${e(a.type)} · ${fmtDate(a.date)}</span></div><strong>${e(a.title)}</strong><p class="sub">${e(a.body)}</p>${a.animalId?btn('Open animal',`openAnimal('${a.animalId}', '${a.type==='Milk trend'?'milk':'health'}')`,'tiny soft'):a.tab?btn('Open module',`navigate('${a.tab}')`,'tiny soft'):''}</div>`).join(''):empty('✧','No rule-based alerts from the records entered. This does not imply that the farm is risk-free.')}`):intelligenceTab==='readiness'?card('Individual dairy nutrition · missing requirements',`${v3notice('The future nutrient engine requires verified dry-matter/nutrient values, weight, lactation stage, milk yield and relevant pregnancy/health data. No ration is prescribed here.',true)}${v3table(['Animal','Missing input / dependency','Action'],missing.map(x=>`<tr>${v3td(e(x.tag))}${v3td(e(x.missing.join(', ')||'Basic fields recorded; validation still needed'))}${v3td(btn('Review',`openAnimal('${x.animalId}','overview')`,'tiny'))}</tr>`))}`):card('Explainability & trust',`<div class="item"><div class="symbol">▥</div><div class="details"><strong>Milk-trend signal</strong><small>Only generated with at least four distinct recorded milk days; warns when latest recorded day is 20% lower than mean of three earlier recorded days. This is a screening heuristic, not a diagnosis.</small></div></div><div class="item"><div class="symbol">♧</div><div class="details"><strong>Stock and lot warnings</strong><small>Calculated against locally entered lots, feed-mix ingredient consumption, feed offerings and write-offs.</small></div></div><div class="item"><div class="symbol">♡</div><div class="details"><strong>Veterinary safety</strong><small>Known medication withdrawal uncertainty and overdue follow-ups remain visible. A closed case cannot override a withdrawal flag.</small></div></div><div class="notice amber">No trained AI, nutritional equations, clinical decision engine or validated financial forecast is running. Associations between milk, feed, treatments and supplier lots are not causal evidence.</div>`)}<div class="section">${v3notice('All insights are generated locally from the data entered in this browser. Missing observations, unrecorded stock usage or unverified medication information can invalidate these summaries.',true)}</div>`}
function overview(){const milk=db.events.filter(x=>x.type==='milk'&&!x.voided),past7=milk.filter(x=>v3inRange(x.date,7)),fin=v3FinanceTotals(v3FinancePeriod()),alerts=v3Insights(),todos=v3TasksDue();return heading('FARM COMMAND CENTER','Good to see you at Origami','Operational picture from this browser’s entered records, with example farm baselines clearly separated.',`<div class="row wrap">${btn('+ Record activity',"openForm('record')",'primary')}${btn('Export data',"exportData()",'soft')}</div>`)+`<div class="grid four">${metric('Milk · 7 days',fmt(v3sum(past7,'liters'))+' L','Recorded, not estimated')}${metric('Animals',db.animals.length,'Includes '+db.animals.filter(x=>x.demo).length+' samples')}${metric('Open work orders',db.workOrders.filter(x=>x.status!=='Done').length,'Tasks requiring action')}${metric('Attention signals',alerts.length,'From transparent local rules')}</div><div class="grid two section">${card('Today · priority actions',`${todos.length?todos.slice(0,5).map(w=>`<div class="item"><div class="symbol">☷</div><div class="details"><strong>${e(w.title)}</strong><small>${e(w.assignedTo||'Unassigned')} · Due ${fmtDate(w.due)}</small></div>${btn('Open',"navigate('operations')",'tiny')}</div>`).join(''):empty('☀','No work orders scheduled for today.')}<div class="row wrap section">${btn('Open worker day',"navigate('day')",'soft')}${btn('View operations',"navigate('operations')",'soft')}</div>`)}${card('Farm signals',`${alerts.length?alerts.slice(0,4).map(x=>`<div class="item"><div class="symbol">${x.level==='Warning'?'⚠':'◌'}</div><div class="details"><strong>${e(x.title)}</strong><small>${e(x.type)} · ${fmtDate(x.date)}</small></div></div>`).join(''):empty('✧','No alerts generated from current local records.')}<div class="row wrap section">${btn('Explore intelligence',"navigate('intelligence')",'soft')}</div>`)}</div><div class="grid two section">${card('This browser’s financial journal',`${krow('Income · last 30 days',v3currency(fin.income))}${krow('Expense · last 30 days',v3currency(fin.expense))}${krow('Net journal difference',v3currency(fin.income-fin.expense))}<div class="sub">These are entered transactions only, not farm profitability or cash statements.</div><div class="section">${btn('Finance',"navigate('finance')",'soft')}</div>`)}${card('Reported farm baseline · not live',`${krow('Milking cows previously reported','10')}${krow('Weekly milk previously reported','~800 L')}${krow('Weekly milk sales previously reported','$600')}${krow('Partial feed cost estimate','$712–754 / week')}<div class="notice amber">Reference figures were previously supplied and may not represent current live production. Do not combine them with new journal entries as if both are current.</div>`)}</div><div class="section">${card('Quick actions',`<div class="quick">${[['animals','🐄','Animals'],['feed','🌾','Feed & mixing'],['production','🥛','Milk & yields'],['inventory','▤','Inventory'],['health','♡','Veterinary'],['crops','♣','Crops'],['operations','☷','Work orders'],['finance','$','Finance']].map(([id,icon,label])=>`<button onclick="navigate('${id}')"><i>${icon}</i>${label}</button>`).join('')}</div>`)}</div>`}
function day(){const jobs=[['06:00','Morning milking','milk'],['06:00','Morning feeding','feed'],['11:30','Midday forage','feed'],['18:00','Evening milking','milk'],['18:00','Evening feeding','feed']],key=today(),arr=db.tasks[key]||[false,false,false,false,false],n=arr.filter(Boolean).length;const assigned=db.workOrders.filter(w=>w.status!=='Done'&&w.due&&w.due<=today());return heading('WORKER EXPERIENCE','Start My Day','Record actual tasks while keeping routine checkmarks distinct from animal/stock events.',btn('+ Animal record',"openForm('record')",'primary'))+`<div class="grid three">${metric('Daily routine',n+' / '+jobs.length,'Checked off locally')}${metric('Open assigned work',assigned.length,'Due now or overdue')}${metric('Milk records today',db.events.filter(x=>x.type==='milk'&&!x.voided&&x.date===today()).length,'Actual entries')}</div><div class="grid two section">${card('Daily husbandry routine',`<div class="progress"><strong>${n} / ${jobs.length} complete</strong><div class="bar"><div style="width:${n/jobs.length*100}%"></div></div></div>${jobs.map(([at,name,type],i)=>`<div class="task ${arr[i]?'done':''}"><input type="checkbox" aria-label="Complete ${e(name)}" ${arr[i]?'checked':''} onchange="setTask(${i},this.checked)"><div class="details"><strong>${e(name)}</strong><p class="sub" style="margin:3px 0">${at} · ${type==='milk'?'Record milk per cow':'Record feed source and animal intake'}</p></div>${btn('Record',`openForm('${type}')`,'tiny')}</div>`).join('')}<div class="notice amber">Checkboxes do not create feeding, milk or inventory events. Post the actual record separately.</div>`)}${card('Assigned work orders',`${assigned.length?assigned.map(w=>`<div class="task"><div class="details"><strong>${e(w.title)}</strong><p class="sub">${e(w.assignedTo||'Team')} · ${fmtDate(w.due)}</p>${v3TaskStatus(w)}</div>${btn('Complete',`v3CompleteTask('${w.id}')`,'tiny primary')}</div>`).join(''):empty('☷','No scheduled work orders due.')}<div class="row wrap section">${btn('All tasks',"navigate('operations')",'soft')}</div>`)}</div>`}
function openForm(type,id=''){if(type==='supplier')return v3OpenSupplier();if(type==='receipt')return v3OpenReceipt();if(type==='stockIssue')return v3OpenStockIssue();if(type==='mix')return v3OpenMix();if(type==='formula')return v3OpenFormula();if(type==='feed')return v3OpenFeed(id);if(type==='productionRecord')return v3OpenProduction();if(type==='case')return v3OpenCase();if(type==='field')return v3OpenField();if(type==='cropActivity')return v3OpenCropActivity(id);if(type==='financeTx')return v3OpenFinance();if(type==='workOrder')return v3OpenWorkOrder();if(type==='asset')return v3OpenAsset();if(type==='assetService')return v3OpenAssetService();return originalOpenForm(type,id)}
function showModal(type){if(type==='about')return modal(formShell('About Origami FarmOS · V3',`<h3>Farm-wide interactive prototype</h3><p>Animal Registry & Digital Twin, individual milk/feed/weight/reproduction/medication records, Feed mixes and supplier lots, Inventory, Crops, Production, Finance, Operations and transparent rule-based signals.</p>${v3notice('This is a standalone browser demonstration, not a production farm system. Data is stored in this browser only. Switching roles is NOT secure authentication. AI/nutrient optimizer, shared database, audited inventory ledger, food safety approval, farm-wide sequential numbers and multi-device synchronization are NOT connected.',true)}<div class="row wrap">${btn('⇩ Export JSON',"exportData()",'soft')}${canAdmin()?btn('Reset all browser data',"resetDemo()",'danger'):''}</div>`));return originalShowModal(type)}
function exportAnimal(id){const a=animal(id);if(!a)return;downloadJSON('origami-'+a.tag+'-'+today()+'.json',{schema:'origami-prototype-v3',exportedAt:new Date().toISOString(),animal:a,events:db.events.filter(x=>x.animalId===id),healthCases:db.healthCases.filter(x=>x.animalId===id),audit:db.audit.filter(x=>x.animalId===id)})}
function exportData(){downloadJSON('origami-farmos-v3-browser-demo-'+today()+'.json',{schema:'origami-prototype-v3',exportedAt:new Date().toISOString(),...db});notify('JSON export downloaded')}
function resetDemo(){if(!canAdmin())return notify('Owner / Admin only');if(!confirm('Remove all browser demo records and photos? Please export your data first.'))return;if(!confirm('Final confirmation: permanently reset this browser’s Origami prototype?'))return;db=structuredClone(demoSeed);for(const [k,v]of Object.entries(v3Defaults))db[k]=structuredClone(v);persist();selectedAnimalId=null;filterSearch='';filterSpecies='all';filterStatus='Active';closeModal();navigate('overview');notify('All browser prototype records reset')}
/* Preserve the original V2 animal forms and veterinary record handling. */

boot();
</script></body></html>
